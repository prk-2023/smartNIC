[package]
name = "xsk-reflect-ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
# aya-ebpf: the in-kernel half of aya (helpers, maps, XdpContext, macros).
aya-ebpf = "0.1.1"
xsk-reflect-common = { path = "../xsk-reflect-common" }

[[bin]]
name = "xsk-reflect-ebpf"
path = "src/main.rs"

# This crate is its own cargo workspace: it is built for a different target
# (bpfel-unknown-none) and a different toolchain (nightly) than the rest.
[workspace]

# eBPF programs must abort on panic and be fully optimised: the verifier
# rejects unbounded loops and most of the code that debug builds produce.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
# Keep debug info (BTF) so aya can relocate maps and tools can symbolise.
debug = 2
